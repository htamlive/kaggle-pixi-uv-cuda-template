name: CI
on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse, compile, and test archives
        run: |
          python -c 'import json,pathlib,tomllib; [tomllib.loads(p.read_text()) for p in pathlib.Path(".").rglob("*.toml")]; [json.loads(p.read_text()) for p in pathlib.Path(".").rglob("*.json")]'
          python -m compileall -q kaggle_entrypoint.py tests projects
          python -m unittest discover -s tests -v
