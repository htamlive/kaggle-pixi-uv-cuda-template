[project]
name = "pixi-uv-cuda-template"
version = "0.1.0"
description = "Minimal reproducible PyTorch CUDA environment managed by Pixi and uv"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["torch==2.4.1"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
