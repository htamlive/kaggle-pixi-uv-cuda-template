[workspace]
name = "pixi-uv-cuda-research-stack"
version = "0.1.0"
channels = ["conda-forge"]
platforms = [{ platform = "linux-64", cuda = "12.4" }]

[dependencies]
uv = ">=0.12,<0.13"
cuda-toolkit = "12.4.*"
cuda-nvcc = "12.4.*"
ninja = ">=1.12"

[activation.env]
# IMPORTANT: remove CUDA_HOME if you remove cuda-toolkit/cuda-nvcc above.
CUDA_HOME = "$CONDA_PREFIX"
UV_PYTHON_PREFERENCE = "only-managed"

[tasks]
setup = "uv sync"
check-gpu = "uv run python scripts/check_cuda.py"
